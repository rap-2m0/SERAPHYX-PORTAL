<!DOCTYPE html>
<html>
<head>
  <title>User Portal</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Poem-style narrow card */
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
    }

    h2 {
      margin-top: 0;
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      text-align: center;
    }

    input {
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #28a745;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 12px;
    }

    button:hover {
      background-color: #218838;
    }

    .btn-secondary {
      background-color: #007bff;
    }

    .btn-secondary:hover {
      background-color: #0056b3;
    }

    .btn-back {
      background-color: #6c757d;
      margin-top: 8px;
    }

    .btn-back:hover {
      background-color: #5a6268;
    }

    #pinStatus, #formStatus {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- STEP 1: PASSCODE SCREEN -->
  <div class="card" id="pinCard">
    <h2>Enter Access PIN</h2>
    <input type="password" id="pinInput" placeholder="Enter PIN">
    <button onclick="checkPin()">Unlock</button>
    <p id="pinStatus"></p>
  </div>

  <!-- STEP 2: MENU OPTIONS (Registration vs Payment) -->
  <div class="card" id="menuCard" style="display: none;">
    <h2>Select Option</h2>
    <button onclick="openForm('register')">Registration</button>
    <button class="btn-secondary" onclick="openForm('payment')">Payment / Renewal</button>
  </div>

  <!-- STEP 3: DYNAMIC FORM SCREEN -->
  <div class="card" id="formCard" style="display: none;">
    <h2 id="formTitle">Registration</h2>
    
    <input type="text" id="nameInput" placeholder="Enter Name">
    <input type="text" id="rankInput" placeholder="Enter Rank">
    <input type="number" id="balInput" placeholder="Enter Balance / Payment Amount">
    
    <button onclick="submitForm()" id="submitBtn">Submit</button>
    <button class="btn-back" onclick="showMenu()">Back</button>

    <p id="formStatus"></p>
  </div>

  <script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbzX1YyC_m000oQL2BNK-Ha05ygKXCJMObtsoWH8YBym0rMzvXwxaeeKk7gU7Ck8fiDs/exec";
    
    let verifiedPin = "";
    let currentMode = ""; // "register" OR "payment"

    // 1. VERIFY PIN
    function checkPin() {
      const pinInput = document.getElementById("pinInput");
      const pinStatus = document.getElementById("pinStatus");
      const enteredPin = pinInput.value.trim();

      if (!enteredPin) {
        pinStatus.textContent = "Please enter PIN!";
        pinStatus.style.color = "red";
        return;
      }

      pinStatus.textContent = "Verifying...";
      pinStatus.style.color = "#555";

      const formData = new FormData();
      formData.append("action", "verify_pin");
      formData.append("pin", enteredPin);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "PIN_VALID") {
          verifiedPin = enteredPin;
          document.getElementById("pinCard").style.display = "none";
          document.getElementById("menuCard").style.display = "block";
        } else {
          pinStatus.textContent = "Incorrect PIN!";
          pinStatus.style.color = "red";
          pinInput.value = "";
        }
      })
      .catch(err => {
        pinStatus.textContent = "Error checking PIN.";
        pinStatus.style.color = "red";
        console.error(err);
      });
    }

    // 2. SHOW MENU / FORM SWITCHING
    function openForm(mode) {
      currentMode = mode;
      document.getElementById("menuCard").style.display = "none";
      document.getElementById("formCard").style.display = "block";
      document.getElementById("formStatus").textContent = "";

      const title = document.getElementById("formTitle");
      const balInput = document.getElementById("balInput");
      const submitBtn = document.getElementById("submitBtn");

      if (mode === "register") {
        title.textContent = "User Registration";
        balInput.placeholder = "Enter Initial Balance";
        submitBtn.textContent = "Register User";
      } else {
        title.textContent = "Payment & Renewal";
        balInput.placeholder = "Enter Payment Amount";
        submitBtn.textContent = "Process Payment";
      }
    }

    function showMenu() {
      document.getElementById("formCard").style.display = "none";
      document.getElementById("menuCard").style.display = "block";
      clearInputs();
    }

    function clearInputs() {
      document.getElementById("nameInput").value = "";
      document.getElementById("rankInput").value = "";
      document.getElementById("balInput").value = "";
    }

    // 3. SUBMIT FORM DATA
    function submitForm() {
      const nameInput = document.getElementById("nameInput");
      const rankInput = document.getElementById("rankInput");
      const balInput  = document.getElementById("balInput");
      
      const nameValue = nameInput.value.trim();
      const rankValue = rankInput.value.trim();
      const balValue  = balInput.value.trim();
      
      const statusText = document.getElementById("formStatus");

      if (!nameValue || !balValue) {
        statusText.textContent = "Please fill in Name and Balance!";
        statusText.style.color = "red";
        return;
      }

      statusText.textContent = "Processing...";
      statusText.style.color = "#555";

      const formData = new FormData();
      formData.append("action", currentMode === "register" ? "register_user" : "process_payment");
      formData.append("pin", verifiedPin);
      formData.append("name", nameValue);
      formData.append("rank", rankValue);
      formData.append("bal", balValue);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "DUPLICATE_ERROR") {
          statusText.textContent = "Error: User already exists!";
          statusText.style.color = "red";
        } 
        else if (result === "USER_NOT_FOUND") {
          statusText.textContent = "Error: User not found! Register first.";
          statusText.style.color = "red";
        }
        else if (result === "REGISTRATION_SUCCESS") {
          statusText.textContent = "Registered successfully!";
          statusText.style.color = "green";
          clearInputs();
        }
        else if (result === "PAYMENT_SUCCESS") {
          statusText.textContent = "Payment added & Expiration extended!";
          statusText.style.color = "green";
          clearInputs();
        }
        else {
          statusText.textContent = "Error submitting request.";
          statusText.style.color = "red";
        }
      })
      .catch(err => {
        statusText.textContent = "Network error. Try again.";
        statusText.style.color = "red";
        console.error(err);
      });
    }
  </script>

</body>
</html>
