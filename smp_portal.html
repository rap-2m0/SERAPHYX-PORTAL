<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal</title>
  <style>
    :root {
      --primary: #28a745;
      --secondary: #007bff;
      --gray: #6c757d;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    h2 { margin: 0 0 20px 0; font-size: 22px; font-weight: 700; }

    form { display: flex; flex-direction: column; gap: 12px; }

    input, button {
      width: 100%;
      min-height: 48px;
      font-size: 16px;
      border-radius: 8px;
      text-align: center;
    }

    input {
      border: 1.5px solid #dcdfe6;
      outline: none;
      background-color: #fafafa;
    }

    button {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-admin { background-color: #dc3545; }
    .btn-back { background-color: var(--gray); margin-top: 8px; }
    .btn-action { background-color: var(--secondary); }

    .toggle-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 14px;
      color: var(--secondary);
      cursor: pointer;
      text-decoration: underline;
    }

    .status-msg {
      margin: 16px 0 0 0;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .info-box {
      text-align: left;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-top: 15px;
      border: 1px solid #e9ecef;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #dee2e6;
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { font-weight: 600; color: #495057; }
    .info-value { color: #212529; }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: SELECT PORTAL MODE -->
  <main class="card" id="roleSelectCard">
    <h2>Select Portal</h2>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button type="button" onclick="openPlayerPortal()">Player Portal</button>
      <button type="button" class="btn-admin" onclick="openAdminPortal()">Admin Portal</button>
    </div>
  </main>

  <!-- SCREEN 2: PLAYER AUTH -->
  <main class="card" id="playerAuthCard" style="display: none;">
    <h2 id="playerAuthTitle">Player Login</h2>

    <form id="playerLoginForm" autocomplete="off" onsubmit="event.preventDefault(); handlePlayerLogin();">
      <input type="text" id="pLoginIgn" placeholder="In Game Name" autocomplete="off" required>
      <input type="password" id="pLoginPass" placeholder="Password" autocomplete="new-password" required>
      <button type="submit">Login</button>
      <button type="button" class="btn-back" onclick="showRoleSelection()">Back</button>
    </form>

    <form id="playerSignupForm" style="display: none;" autocomplete="off" onsubmit="event.preventDefault(); handlePlayerSignup();">
      <input type="text" id="pSignName" placeholder="Name" autocomplete="off" required>
      <input type="text" id="pSignDiscord" placeholder="Discord Name" autocomplete="off" required>
      <input type="text" id="pSignIgn" placeholder="In Game Name" autocomplete="off" required>
      <input type="password" id="pSignPass" placeholder="Password" autocomplete="new-password" required>
      <button type="submit">Sign Up</button>
      <button type="button" class="btn-back" onclick="showRoleSelection()">Back</button>
    </form>

    <span class="toggle-link" id="togglePlayerAuthBtn" onclick="togglePlayerAuth()">Need an account? Sign Up</span>
    <p class="status-msg" id="playerStatus"></p>
  </main>

  <!-- SCREEN 3: ADMIN AUTH -->
  <main class="card" id="adminAuthCard" style="display: none;">
    <h2>Admin Login</h2>

    <form id="adminLoginForm" autocomplete="off" onsubmit="event.preventDefault(); handleAdminLogin();">
      <input type="text" id="aLoginIgn" placeholder="Admin In Game Name" autocomplete="off" required>
      <input type="password" id="aLoginPass" placeholder="Password" autocomplete="new-password" required>
      <button type="submit" class="btn-admin">Admin Login</button>
      <button type="button" class="btn-back" onclick="showRoleSelection()">Back</button>
    </form>

    <p class="status-msg" id="adminStatus"></p>
  </main>

  <!-- SCREEN 4: PLAYER DASHBOARD -->
  <main class="card" id="playerDashboardCard" style="display: none;">
    <h2 id="playerDashTitle">Player Profile</h2>
    <p class="status-msg" id="playerFetchStatus"></p>
    <div id="playerProfileContent" class="info-box" style="display: none;"></div>
    <button type="button" class="btn-back" onclick="showRoleSelection()">Logout</button>
  </main>

  <!-- SCREEN 5: ADMIN DASHBOARD -->
  <main class="card" id="adminDashboardCard" style="display: none;">
    <h2>Admin Control Panel</h2>
    
    <!-- ADMIN MAIN MENU BUTTONS -->
    <div id="adminMenu" class="menu-grid">
      <button type="button" class="btn-action" onclick="loadAdminView('players')">List of All Players</button>
      <button type="button" class="btn-action" onclick="loadAdminView('payments')">Payments</button>
    </div>

    <!-- VIEW CONTAINER FOR CONTENT -->
    <div id="adminViewContainer" style="display: none;">
      <h3 id="adminViewTitle" style="margin-top:0;"></h3>
      <div id="adminDataContent" class="info-box"></div>
      <button type="button" class="btn-back" onclick="resetAdminView()">Back to Admin Menu</button>
    </div>

    <button type="button" class="btn-back" id="adminLogoutBtn" onclick="showRoleSelection()">Logout</button>
  </main>


  <script>
  // Updated Web App Endpoints
  const PLAYER_API = "https://script.google.com/macros/s/AKfycbwmtbQbJVdhtPEfKF9QK3MwDPi6MMuXP1KMdMMnravv5e9WYGQFhzCIGwpaLRXBc4O-/exec";
  const ADMIN_API  = "https://script.google.com/macros/s/AKfycbyZbINVf7xSp_rBYrWJfP_w6oVh8lYTIV57P-Qqh1Hacse_ghRnZSugWt8WG7WbqX9n/exec";

  let playerMode = "login";
  let currentUserIgn = "";

  function showRoleSelection() {
    document.getElementById("roleSelectCard").style.display = "block";
    document.getElementById("playerAuthCard").style.display = "none";
    document.getElementById("adminAuthCard").style.display = "none";
    document.getElementById("playerDashboardCard").style.display = "none";
    document.getElementById("adminDashboardCard").style.display = "none";
    currentUserIgn = "";
    clearAllInputs();
  }

  function openPlayerPortal() {
    document.getElementById("roleSelectCard").style.display = "none";
    document.getElementById("playerAuthCard").style.display = "block";
    document.getElementById("playerStatus").textContent = "";
  }

  function openAdminPortal() {
    document.getElementById("roleSelectCard").style.display = "none";
    document.getElementById("adminAuthCard").style.display = "block";
    document.getElementById("adminStatus").textContent = "";
  }

  function togglePlayerAuth() {
    const title = document.getElementById("playerAuthTitle");
    const loginForm = document.getElementById("playerLoginForm");
    const signupForm = document.getElementById("playerSignupForm");
    const toggleBtn = document.getElementById("togglePlayerAuthBtn");

    document.getElementById("playerStatus").textContent = "";
    clearAllInputs();

    if (playerMode === "login") {
      playerMode = "signup";
      title.textContent = "Player Sign Up";
      loginForm.style.display = "none";
      signupForm.style.display = "flex";
      toggleBtn.textContent = "Already have an account? Login";
    } else {
      playerMode = "login";
      title.textContent = "Player Login";
      signupForm.style.display = "none";
      loginForm.style.display = "flex";
      toggleBtn.textContent = "Need an account? Sign Up";
    }
  }

  // --- PLAYER AUTH & PROFILE FETCH ---
  function handlePlayerLogin() {
    const ign = document.getElementById("pLoginIgn").value.trim();
    const pass = document.getElementById("pLoginPass").value.trim();
    const status = document.getElementById("playerStatus");

    status.textContent = "Authenticating...";
    status.style.color = "#555";
    
    sendReq(PLAYER_API, { action: "player_login", ign: ign, password: pass }, (res) => {
      console.log("Player Login Response:", res);
      if (res === "LOGIN_SUCCESS") {
        currentUserIgn = ign;
        openPlayerDashboard();
      } else {
        status.textContent = "Invalid Credentials! (Response: " + res + ")";
        status.style.color = "#d9534f";
      }
    });
  }

  function handlePlayerSignup() {
    const name = document.getElementById("pSignName").value.trim();
    const discord = document.getElementById("pSignDiscord").value.trim();
    const ign = document.getElementById("pSignIgn").value.trim();
    const pass = document.getElementById("pSignPass").value.trim();
    const status = document.getElementById("playerStatus");

    status.textContent = "Registering...";
    status.style.color = "#555";

    sendReq(PLAYER_API, { action: "player_signup", name: name, discord: discord, ign: ign, password: pass }, (res) => {
      console.log("Player Signup Response:", res);
      if (res === "DUPLICATE_ERROR") {
        status.textContent = "IGN already registered!";
        status.style.color = "#d9534f";
      } else if (res === "REGISTRATION_SUCCESS") {
        status.textContent = "Success! Redirecting to login...";
        status.style.color = "var(--primary)";
        setTimeout(() => togglePlayerAuth(), 1200);
      } else {
        status.textContent = "Signup Failed: " + res;
        status.style.color = "#d9534f";
      }
    });
  }

  function openPlayerDashboard() {
    document.getElementById("playerAuthCard").style.display = "none";
    document.getElementById("playerDashboardCard").style.display = "block";
    
    const fetchStatus = document.getElementById("playerFetchStatus");
    const profileBox = document.getElementById("playerProfileContent");
    fetchStatus.textContent = "Loading your profile...";
    fetchStatus.style.color = "#555";
    profileBox.style.display = "none";

    sendReq(PLAYER_API, { action: "get_player_info", ign: currentUserIgn }, (res) => {
      console.log("Get Player Info Response:", res);
      try {
        const data = JSON.parse(res);
        if (data.error) {
          fetchStatus.textContent = "Profile information not found.";
          fetchStatus.style.color = "#d9534f";
          return;
        }

        fetchStatus.textContent = "";
        let html = "";
        for (let key in data) {
          if (key.toLowerCase() !== "password") {
            html += `
              <div class="info-row">
                <span class="info-label">${key}</span>
                <span class="info-value">${data[key]}</span>
              </div>`;
          }
        }
        profileBox.innerHTML = html;
        profileBox.style.display = "block";
      } catch (e) {
        fetchStatus.textContent = "Error parsing profile data: " + res;
        fetchStatus.style.color = "#d9534f";
      }
    });
  }

  // --- ADMIN AUTH & VIEWS ---
  function handleAdminLogin() {
    const ign = document.getElementById("aLoginIgn").value.trim();
    const pass = document.getElementById("aLoginPass").value.trim();
    const status = document.getElementById("adminStatus");

    status.textContent = "Authenticating Admin...";
    status.style.color = "#555";

    sendReq(ADMIN_API, { action: "admin_login", ign: ign, password: pass }, (res) => {
      console.log("Admin Login Response:", res);
      if (res === "LOGIN_SUCCESS") {
        document.getElementById("adminAuthCard").style.display = "none";
        document.getElementById("adminDashboardCard").style.display = "block";
        resetAdminView();
      } else {
        status.textContent = "Access Denied! Server sent: " + (res || "No Response");
        status.style.color = "#d9534f";
      }
    });
  }

  function resetAdminView() {
    document.getElementById("adminMenu").style.display = "flex";
    document.getElementById("adminViewContainer").style.display = "none";
    document.getElementById("adminLogoutBtn").style.display = "block";
  }

  function loadAdminView(viewType) {
    document.getElementById("adminMenu").style.display = "none";
    document.getElementById("adminLogoutBtn").style.display = "none";
    
    const container = document.getElementById("adminViewContainer");
    const title = document.getElementById("adminViewTitle");
    const content = document.getElementById("adminDataContent");
    
    container.style.display = "block";
    content.textContent = "Loading data...";

    if (viewType === "players") {
      title.textContent = "List of All Players";
      sendReq(ADMIN_API, { action: "get_all_players" }, (res) => {
        renderTableData(content, res);
      });
    } else if (viewType === "payments") {
      title.textContent = "Payments Overview";
      sendReq(ADMIN_API, { action: "get_all_payments" }, (res) => {
        renderTableData(content, res);
      });
    }
  }

  function renderTableData(element, jsonResponse) {
    try {
      const list = JSON.parse(jsonResponse);
      if (!Array.isArray(list) || list.length === 0) {
        element.textContent = "No records found.";
        return;
      }

      let html = "";
      list.forEach((item, index) => {
        html += `<div style="margin-bottom:8px; font-weight:bold; color: var(--secondary);">Record #${index + 1}</div>`;
        for (let k in item) {
          if (k.toLowerCase() !== "password") {
            html += `
              <div class="info-row">
                <span class="info-label">${k}</span>
                <span class="info-value">${item[k]}</span>
              </div>`;
          }
        }
        html += `<hr style="border:0; border-top:1px dashed #ccc; margin:12px 0;">`;
      });
      element.innerHTML = html;
    } catch (e) {
      element.textContent = "Error rendering data: " + jsonResponse;
    }
  }

  // --- UTILS ---
  function sendReq(targetUrl, params, callback) {
    const payload = new URLSearchParams();
    for (let key in params) payload.append(key, params[key]);

    fetch(targetUrl, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: payload
    })
    .then(r => r.text())
    .then(txt => callback(txt.trim()))
    .catch(err => {
      console.error("Network/Fetch Error:", err);
      callback("NETWORK_ERROR");
    });
  }

  function clearAllInputs() {
    document.querySelectorAll("input").forEach(i => i.value = "");
  }
</script>
  
  
 
</body>
</html>
