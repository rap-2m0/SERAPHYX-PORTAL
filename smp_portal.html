<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal</title>
  <style>
    :root {
      --primary-color: #28a745;
      --primary-hover: #218838;
      --secondary-color: #007bff;
      --secondary-hover: #0056b3;
      --gray-color: #6c757d;
      --gray-hover: #5a6268;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-color);
    }

    /* Mobile-optimized card layout */
    .card {
      background: var(--card-bg);
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 700;
    }

    /* Form accessibility & mobile input sizing */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 16px font size prevents iOS safari from auto-zooming on focus */
    input, button {
      width: 100%;
      min-height: 48px;
      font-size: 16px;
      border-radius: 8px;
      text-align: center;
      -webkit-appearance: none;
    }

    input {
      border: 1.5px solid #dcdfe6;
      outline: none;
      background-color: #fafafa;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    button {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:active {
      transform: scale(0.99);
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-color);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-back {
      background-color: var(--gray-color);
      margin-top: 4px;
    }

    .btn-back:hover {
      background-color: var(--gray-hover);
    }

    .toggle-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 14px;
      color: var(--secondary-color);
      cursor: pointer;
      text-decoration: underline;
      padding: 6px;
    }

    .status-msg {
      margin: 16px 0 0 0;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
      word-wrap: break-word;
    }

    .welcome-text {
      color: #666;
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* High contrast focus rings for accessibility navigation */
    input:focus-visible, button:focus-visible, .toggle-link:focus-visible {
      outline: 2px solid var(--secondary-color);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: AUTH CARD (LOGIN / SIGN UP) -->
  <main class="card" id="authCard">
    <h2 id="authTitle">Portal Login</h2>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <input type="text" id="loginIgn" placeholder="In Game Name" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>

    <!-- SIGN UP FORM (Hidden by default) -->
    <form id="signupForm" style="display: none;" onsubmit="event.preventDefault(); handleSignup();">
      <input type="text" id="signupName" placeholder="Name" autocomplete="name" required>
      <input type="text" id="signupDiscord" placeholder="Discord Name" required>
      <input type="text" id="signupIgn" placeholder="In Game Name" autocomplete="username" required>
      <input type="password" id="signupPass" placeholder="Password" autocomplete="new-password" required>
      <button type="submit">Sign Up</button>
    </form>

    <!-- Toggle Link -->
    <span class="toggle-link" id="toggleAuthBtn" tabindex="0" role="button" onclick="toggleAuthMode()" onkeydown="if(event.key==='Enter') toggleAuthMode();">Need an account? Sign Up</span>

    <p class="status-msg" id="authStatus" aria-live="polite"></p>
  </main>

  <!-- SCREEN 2: DASHBOARD MENU -->
  <main class="card" id="menuCard" style="display: none;">
    <h2>Dashboard</h2>
    <p class="welcome-text" id="welcomeMsg">Welcome!</p>
    
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button type="button" onclick="openPaymentForm()">Payment / Renewal</button>
      <button type="button" class="btn-back" onclick="handleLogout()">Logout</button>
    </div>
  </main>

  <!-- SCREEN 3: PAYMENT & RENEWAL FORM -->
  <main class="card" id="paymentCard" style="display: none;">
    <h2>Process Payment</h2>
    
    <form onsubmit="event.preventDefault(); submitPayment();">
      <input type="text" id="targetIgn" placeholder="Target In Game Name" required>
      <input type="number" id="payAmount" placeholder="Payment Amount" step="any" required>
      <input type="text" id="payRank" placeholder="Rank (Optional)">
      
      <button type="submit">Submit Payment</button>
      <button type="button" class="btn-back" onclick="showDashboard()">Back</button>
    </form>

    <p class="status-msg" id="paymentStatus" aria-live="polite"></p>
  </main>

  <script>
    // Paste your Google Web App URL here
    const API_URL = "https://script.google.com/macros/s/AKfycbzFCxfKWZGBtCwsa0jTaVc3Mua-9MABi7_Lh99l5MJBMpDEVw8mNN1jF2gHgpzheV8f/exec";

    let currentAuthMode = "login"; // "login" OR "signup"
    let loggedInIgn = "";

    // 1. TOGGLE BETWEEN LOGIN AND SIGN UP
    function toggleAuthMode() {
      const authTitle = document.getElementById("authTitle");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const toggleBtn = document.getElementById("toggleAuthBtn");
      const status = document.getElementById("authStatus");

      status.textContent = "";

      if (currentAuthMode === "login") {
        currentAuthMode = "signup";
        authTitle.textContent = "Create Account";
        loginForm.style.display = "none";
        signupForm.style.display = "flex";
        toggleBtn.textContent = "Already have an account? Login";
      } else {
        currentAuthMode = "login";
        authTitle.textContent = "Portal Login";
        signupForm.style.display = "none";
        loginForm.style.display = "flex";
        toggleBtn.textContent = "Need an account? Sign Up";
      }
    }

    // 2. HANDLE LOGIN
    function handleLogin() {
      const ign = document.getElementById("loginIgn").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const status = document.getElementById("authStatus");

      if (!ign || !pass) return;

      status.textContent = "Authenticating...";
      status.style.color = "#555";

      const formData = new FormData();
      formData.append("action", "login");
      formData.append("ign", ign);
      formData.append("password", pass);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "LOGIN_SUCCESS") {
          loggedInIgn = ign;
          document.getElementById("welcomeMsg").textContent = `Welcome, ${loggedInIgn}!`;
          document.getElementById("authCard").style.display = "none";
          document.getElementById("menuCard").style.display = "block";
          clearAuthInputs();
        } else {
          status.textContent = "Invalid In Game Name or Password!";
          status.style.color = "#d9534f";
        }
      })
      .catch(err => {
        status.textContent = "Network error. Try again.";
        status.style.color = "#d9534f";
        console.error(err);
      });
    }

    // 3. HANDLE SIGN UP
    function handleSignup() {
      const name = document.getElementById("signupName").value.trim();
      const discord = document.getElementById("signupDiscord").value.trim();
      const ign = document.getElementById("signupIgn").value.trim();
      const pass = document.getElementById("signupPass").value.trim();
      const status = document.getElementById("authStatus");

      if (!name || !discord || !ign || !pass) return;

      status.textContent = "Creating account...";
      status.style.color = "#555";

      const formData = new FormData();
      formData.append("action", "register_user");
      formData.append("name", name);
      formData.append("discord", discord);
      formData.append("ign", ign);
      formData.append("password", pass);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "DUPLICATE_ERROR") {
          status.textContent = "In Game Name already registered!";
          status.style.color = "#d9534f";
        } else if (result === "REGISTRATION_SUCCESS") {
          status.textContent = "Account created! Redirecting to login...";
          status.style.color = "var(--primary-color)";
          clearAuthInputs();
          setTimeout(() => toggleAuthMode(), 1200);
        } else {
          status.textContent = "Registration failed. Try again.";
          status.style.color = "#d9534f";
        }
      })
      .catch(err => {
        status.textContent = "Network error. Try again.";
        status.style.color = "#d9534f";
        console.error(err);
      });
    }

    // 4. SCREEN NAVIGATION
    function openPaymentForm() {
      document.getElementById("menuCard").style.display = "none";
      document.getElementById("paymentCard").style.display = "block";
      document.getElementById("paymentStatus").textContent = "";
    }

    function showDashboard() {
      document.getElementById("paymentCard").style.display = "none";
      document.getElementById("menuCard").style.display = "block";
      clearPaymentInputs();
    }

    function handleLogout() {
      loggedInIgn = "";
      document.getElementById("menuCard").style.display = "none";
      document.getElementById("authCard").style.display = "block";
      document.getElementById("authStatus").textContent = "";
      clearAuthInputs();
    }

    // 5. SUBMIT PAYMENT
    function submitPayment() {
      const targetIgn = document.getElementById("targetIgn").value.trim();
      const amount = document.getElementById("payAmount").value.trim();
      const rank = document.getElementById("payRank").value.trim();
      const status = document.getElementById("paymentStatus");

      if (!targetIgn || !amount) return;

      status.textContent = "Processing payment...";
      status.style.color = "#555";

      const formData = new FormData();
      formData.append("action", "process_payment");
      formData.append("ign", targetIgn);
      formData.append("bal", amount);
      formData.append("rank", rank);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "USER_NOT_FOUND") {
          status.textContent = "Target In Game Name not found!";
          status.style.color = "#d9534f";
        } else if (result === "PAYMENT_SUCCESS") {
          status.textContent = "Payment processed & expiration extended!";
          status.style.color = "var(--primary-color)";
          clearPaymentInputs();
        } else {
          status.textContent = "Payment processing failed.";
          status.style.color = "#d9534f";
        }
      })
      .catch(err => {
        status.textContent = "Network error. Try again.";
        status.style.color = "#d9534f";
        console.error(err);
      });
    }

    // CLEAR HELPERS
    function clearAuthInputs() {
      document.getElementById("loginIgn").value = "";
      document.getElementById("loginPass").value = "";
      document.getElementById("signupName").value = "";
      document.getElementById("signupDiscord").value = "";
      document.getElementById("signupIgn").value = "";
      document.getElementById("signupPass").value = "";
    }

    function clearPaymentInputs() {
      document.getElementById("targetIgn").value = "";
      document.getElementById("payAmount").value = "";
      document.getElementById("payRank").value = "";
    }
  </script>

</body>
</html>
